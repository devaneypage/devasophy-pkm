name: Pre-release Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Full web-app suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: devasophy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:test-password@127.0.0.1:3306/devasophy_test
      JWT_SECRET: ci-quality-gate-secret-at-least-32-characters
      VITE_APP_ID: ci-devasophy-pkm
      VITE_OAUTH_PORTAL_URL: http://127.0.0.1:3999
      VITE_ANALYTICS_ENDPOINT: http://127.0.0.1:3120
      VITE_ANALYTICS_WEBSITE_ID: ci-quality-gate
      VITE_FRONTEND_FORGE_API_URL: http://127.0.0.1:3120
      VITE_FRONTEND_FORGE_API_KEY: ci-mock-key
      OWNER_OPEN_ID: ci-owner
      OWNER_NAME: Devaney
      OAUTH_SERVER_URL: http://127.0.0.1:3999
      WEBAPP_TEST_MOCK_FORGE: "1"
      WEBAPP_TEST_SEED_OWNER: "1"
      ENDPOINT_RESULT_PATH: artifacts/full-endpoint-results.json
      WEBAPP_TEST_SCREENSHOT_PATH: artifacts/full-endpoint-browser.png

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python Playwright and Chromium
        run: |
          python -m pip install --requirement requirements-ci.txt
          python -m playwright install chromium

      - name: Apply current database schema
        run: pnpm exec drizzle-kit push --force

      - name: Run complete quality gate
        run: pnpm test:webapp

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-quality-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
